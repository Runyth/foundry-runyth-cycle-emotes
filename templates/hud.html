<div class="control-icon rce-hud-control" data-action="rce-selector" data-tooltip="{{localize 'RCE.Title'}}" aria-label="{{localize 'RCE.Title'}}">
  <span class="rce-hud-emoji" aria-hidden="true">🎭</span>
  <div class="rce-selector-wrap" role="menu">
    {{#each images as |image index|}}
      <button type="button" class="rce-image-button" data-index="{{index}}" data-tooltip="{{image.name}}" aria-label="{{image.name}}" role="menuitem">
        <img src="{{image.route}}" alt="{{image.name}}" loading="lazy" />
      </button>
    {{/each}}
  </div>
</div>
