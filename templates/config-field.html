<fieldset class="rce-config-fieldset">
  <legend>{{localize "RCE.ConfigLegend"}}</legend>
  <div class="form-group">
    <label>{{localize "RCE.PatternLabel"}}</label>
    <div class="form-fields rce-pattern-fields">
      <button type="button" class="rce-folder-picker" data-tooltip="{{localize 'RCE.ChooseFolder'}}" aria-label="{{localize 'RCE.ChooseFolder'}}">
        <i class="fa-solid fa-folder-open"></i>
      </button>
      <input
        class="rce-pattern-input"
        type="text"
        name="flags.runyth-cycle-emotes.pattern"
        value="{{pattern}}"
        placeholder="{{localize 'RCE.PatternPlaceholder'}}"
        autocomplete="off"
      />
      <button type="button" class="rce-refresh" data-tooltip="{{localize 'RCE.Refresh'}}" aria-label="{{localize 'RCE.Refresh'}}">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
      <input
        class="rce-cache-input"
        type="hidden"
        name="flags.runyth-cycle-emotes.cachedImages"
        value="{{cachedImages}}"
      />
    </div>
    <p class="hint">{{localize "RCE.PatternHint"}}</p>
    <p class="rce-config-status" aria-live="polite"></p>
  </div>
</fieldset>
